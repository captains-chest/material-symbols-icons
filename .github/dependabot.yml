version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '08:00'
      timezone: 'Europe/Copenhagen'
    commit-message:
      prefix: 'chore(deps)'
    # This is a pnpm workspace, so the root entry also covers every package in
    # projects/. Dependabot refuses to update from workspace subdirectories.
    # Peer dependency ranges (>=17.0.0, no upper limit) are kept by hand and
    # must never be narrowed.
    groups:
      # Minor and patch updates are grouped. Major updates (including Angular
      # majors: @angular/*, @angular-devkit/*, @schematics/angular, ng-packagr)
      # are never grouped and arrive as separate PRs.
      npm-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '08:00'
      timezone: 'Europe/Copenhagen'
    commit-message:
      prefix: 'chore(deps)'
    groups:
      github-actions-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
