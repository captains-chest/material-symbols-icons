name: Publish packages

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish dual packages with provenance
    runs-on: ubuntu-latest
    environment: npm-publish
    if: github.repository_owner == 'captains-chest'
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.2

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release tag matches package versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node tools/release/verify-lockstep-version.mjs "$RELEASE_TAG"

      - name: Run release checks
        run: pnpm release:check

      - name: Publish outline package
        run: npm publish --access public
        working-directory: dist/material-symbols-rounded-icons

      - name: Publish filled package
        run: npm publish --access public
        working-directory: dist/material-symbols-rounded-icons-filled
