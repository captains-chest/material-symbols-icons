name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deterministic-baseline:
    name: Deterministic CI Baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.2

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read pinned upstream icon ref
        id: upstream
        run: echo "ref=$(node -p "require('./tools/icons/upstream.json').ref")" >> "$GITHUB_OUTPUT"

      - name: Cache upstream SVG snapshot
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/material-symbols
          key: material-symbols-${{ steps.upstream.outputs.ref }}-v1

      - name: Check formatting and lint
        run: pnpm check

      - name: Run deterministic baseline
        run: pnpm ci:baseline

  storybook-build:
    name: Storybook build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.2

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read pinned upstream icon ref
        id: upstream
        run: echo "ref=$(node -p "require('./tools/icons/upstream.json').ref")" >> "$GITHUB_OUTPUT"

      - name: Cache upstream SVG snapshot
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/material-symbols
          key: material-symbols-${{ steps.upstream.outputs.ref }}-v1

      - name: Build Storybook
        run: pnpm build-storybook
